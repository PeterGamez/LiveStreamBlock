name: CI Build & Test

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Gradle Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Run Build & Tests
        run: ./gradlew build --no-daemon
